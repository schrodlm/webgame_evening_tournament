name: Deploy to Fly.io

on:
  release:
    types: [published]
  workflow_dispatch: # manual deploy button in the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: fly-deploy # never two deploys at once
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: one machine is plenty and two would each need their own
      # volume (and would not share the JSON store)
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
