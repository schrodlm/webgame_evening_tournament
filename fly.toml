# Fly.io config for WET.
# App names are global on Fly - if "wet-tournament" is taken, change it here
# and create the app under the new name.
app = "wet-tournament"
primary_region = "fra"

[build]

[env]
  DB_PATH = "/data/wet.json"

[mounts]
  source = "wet_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The machine stops when nobody is connected and wakes on the first request
  # (~1s cold start) - open WebSockets keep it running all game night, and
  # between nights it costs almost nothing.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
