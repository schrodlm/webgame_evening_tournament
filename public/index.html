<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WET - Webgame Evening Tournament</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="landing">
    <h1 class="logo" data-str="appName"></h1>
    <p class="tagline" data-str="tagline"></p>

    <form id="create-form" class="card">
      <h2 data-str="createHeading"></h2>
      <label><span data-str="tournamentNameLabel"></span>
        <input name="name" data-str-placeholder="tournamentNamePlaceholder" maxlength="48" required>
      </label>
      <label><span data-str="nicknameLabel"></span>
        <input name="hostName" data-str-placeholder="nicknamePlaceholder" maxlength="24" required>
      </label>

      <fieldset>
        <legend data-str="pickModeLegend"></legend>
        <label class="radio"><input type="radio" name="pickMode" value="chance" checked>
          <span data-str="pickModeChanceOption"></span></label>
        <label class="radio"><input type="radio" name="pickMode" value="host">
          <span data-str="pickModeHostOption"></span></label>
        <label class="radio"><input type="radio" name="pickMode" value="vote">
          <span data-str="pickModeVoteOption"></span></label>
      </fieldset>

      <fieldset id="pool-fieldset">
        <legend data-str="gamesLegend"></legend>
        <div id="preset-list" class="preset-list"></div>
        <div id="custom-list"></div>
        <div class="pool-actions">
          <button type="button" id="add-custom" class="btn ghost" data-str="addCustomButton"></button>
          <button type="button" id="random-pool" class="btn ghost" data-str="randomPoolButton"></button>
        </div>
        <p class="hint" id="random-note" hidden data-str="randomPoolNote"></p>
      </fieldset>

      <button type="submit" class="btn primary" data-str="createButton"></button>
      <p class="error" id="create-error" hidden></p>
    </form>

    <p class="hint" data-str="joinHintLanding"></p>
  </main>

  <script src="/strings.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let randomPool = false;

    applyStrings();
    document.title = STR.landingTitle;

    const presetRow = (p) => `
      <label class="preset">
        <input type="checkbox" name="preset" value="${p.key}" ${p.defaultOn === false ? '' : 'checked'}>
        <span>${p.emoji} ${p.name}</span>
      </label>`;

    // Variant siblings (two sites, same game) render as one dashed cluster
    // joined by "or"; the non-preferred one starts unchecked but stays checkable.
    const catRows = (list) => {
      const groups = [];
      const byVariant = new Map();
      for (const p of list) {
        if (!p.variantGroup) { groups.push([p]); continue; }
        if (!byVariant.has(p.variantGroup)) {
          byVariant.set(p.variantGroup, []);
          groups.push(byVariant.get(p.variantGroup));
        }
        byVariant.get(p.variantGroup).push(p);
      }
      return groups.map((g) => g.length > 1
        ? `<div class="variant-cluster">${
            g.map(presetRow).join(`<div class="variant-or">${STR.variantOr}</div>`)}</div>`
        : presetRow(g[0])).join('');
    };

    fetch('/api/presets').then((r) => r.json()).then((presets) => {
      const CATEGORY_LABELS = {
        geo: STR.catGeo, drawing: STR.catDrawing, deduction: STR.catDeduction,
        wiki: STR.catWiki, action: STR.catAction, strategy: STR.catStrategy,
        other: STR.catOther,
      };
      const order = Object.keys(CATEGORY_LABELS);
      const byCat = new Map(order.map((k) => [k, []]));
      for (const p of presets) (byCat.get(p.category) || byCat.get('other')).push(p);

      $('preset-list').innerHTML = order
        .filter((k) => byCat.get(k).length)
        .map((k) => `
          <div class="preset-cat">
            <div class="cat-label">${CATEGORY_LABELS[k]}</div>
            ${catRows(byCat.get(k))}
          </div>`).join('');
    });

    $('add-custom').addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'custom-row';
      row.innerHTML = `
        <input class="c-name" data-str-placeholder="customNamePlaceholder" maxlength="48">
        <input class="c-site" type="url" data-str-placeholder="customSitePlaceholder">
        <button type="button" class="btn ghost c-del" data-str-title="removeCustomTitle">✕</button>`;
      row.querySelector('.c-del').addEventListener('click', () => row.remove());
      applyStrings(row);
      $('custom-list').appendChild(row);
      row.querySelector('.c-name').focus();
    });

    $('random-pool').addEventListener('click', () => {
      randomPool = !randomPool;
      $('pool-fieldset').classList.toggle('randomized', randomPool);
      $('random-note').hidden = !randomPool;
      for (const el of $('pool-fieldset').querySelectorAll('input, #add-custom')) {
        el.disabled = randomPool;
      }
    });

    $('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = $('create-error');
      errEl.hidden = true;

      const form = new FormData(e.target);
      const body = {
        name: form.get('name'),
        hostName: form.get('hostName'),
        pickMode: form.get('pickMode'),
      };
      if (randomPool) {
        body.random = true;
      } else {
        const games = [...document.querySelectorAll('input[name=preset]:checked')]
          .map((el) => ({ preset: el.value }));
        for (const row of document.querySelectorAll('.custom-row')) {
          const name = row.querySelector('.c-name').value.trim();
          if (name) games.push({ name, site: row.querySelector('.c-site').value.trim() });
        }
        if (!games.length) {
          errEl.textContent = STR.needOneGameError;
          errEl.hidden = false;
          return;
        }
        body.games = games;
      }

      try {
        const res = await fetch('/api/tournaments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const out = await res.json();
        if (!res.ok) throw new Error(out.error || STR.genericError);
        localStorage.setItem('wet:' + out.code, JSON.stringify({
          playerId: out.playerId,
          playerToken: out.playerToken,
          hostToken: out.hostToken,
        }));
        location.href = '/t/' + out.code;
      } catch (err) {
        errEl.textContent = err.message;
        errEl.hidden = false;
      }
    });
  </script>
</body>
</html>
